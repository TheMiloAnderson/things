{{define "content"}}
{{template "management_nav" .}}
<div class="space-y-4">
    <div class="flex items-center justify-between gap-4">
        <h1 class="text-xl font-semibold">Contexts</h1>
        <a href="/management/contexts/new" class="rounded-md bg-cgr-sage px-3 py-1.5 text-xs font-medium text-cgr-base hover:brightness-110 transition-[filter]">New</a>
    </div>

    {{if not .Contexts}}
    <p class="text-gray-500 text-sm rounded-lg border border-dashed border-cgr-border px-4 py-8 text-center">No contexts yet.</p>
    {{else}}
    <div>
        <div class="grid grid-cols-[1fr_auto] gap-x-3 items-center px-1 py-1.5 border-b border-cgr-border text-[11px] font-medium uppercase tracking-wider text-gray-500">
            <span>Name</span>
            <span></span>
        </div>
        {{range .Contexts}}
        <form class="mgmt-context-form grid grid-cols-[1fr_auto] gap-x-3 items-center px-1 py-1 border-b border-cgr-border/30" data-id="{{.ID}}">
            <input type="text" name="name" value="{{.Name}}" required
                class="w-full rounded border border-cgr-border bg-cgr-panel/60 px-2 py-1 text-sm text-white focus:border-cgr-sage focus:outline-none focus:ring-1 focus:ring-cgr-sage" />
            <div class="flex items-center gap-1.5 whitespace-nowrap">
                <button type="button" class="mgmt-c-update rounded bg-cgr-sage px-2.5 py-1 text-xs font-medium text-cgr-base hover:brightness-110 transition-[filter]">Save</button>
                <button type="button" class="mgmt-c-delete rounded border border-cgr-rose/50 px-2.5 py-1 text-xs font-medium text-cgr-rose hover:bg-cgr-rose/10 transition-colors">Delete</button>
                <span class="mgmt-c-msg text-xs text-gray-500 min-w-[50px]"></span>
            </div>
        </form>
        {{end}}
    </div>
    {{end}}
</div>
<script>
(function () {
  function setMsg(form, text, ok) {
    var el = form.querySelector('.mgmt-c-msg');
    el.textContent = text;
    el.classList.remove('text-cgr-sage', 'text-cgr-rose', 'text-gray-500');
    if (ok === true) el.classList.add('text-cgr-sage');
    else if (ok === false) el.classList.add('text-cgr-rose');
    else el.classList.add('text-gray-500');
  }
  document.querySelectorAll('.mgmt-context-form').forEach(function (form) {
    var id = form.getAttribute('data-id');
    form.querySelector('.mgmt-c-update').addEventListener('click', function () {
      var name = form.querySelector('[name=name]').value.trim();
      if (!name) { setMsg(form, 'Required', false); return; }
      setMsg(form, 'Saving…');
      window.csrfFetch('/api/context/' + id + '/update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name })
      }).then(function (res) { return res.json().then(function (data) { return { res: res, data: data }; }); })
        .then(function (x) {
          if (x.res.ok && x.data.ok) { setMsg(form, 'Saved', true); window.markFormSaved(form); }
          else setMsg(form, (x.data && x.data.error) || 'Failed', false);
        }).catch(function () { setMsg(form, 'Error', false); });
    });
    form.querySelector('.mgmt-c-delete').addEventListener('click', function () {
      if (!confirm('Delete this context?')) return;
      setMsg(form, 'Deleting…');
      window.csrfFetch('/api/context/' + id + '/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: '{}'
      }).then(function (res) { return res.json().then(function (data) { return { res: res, data: data }; }); })
        .then(function (x) {
          if (x.res.ok && x.data.ok) {
            form.remove();
            if (!document.querySelector('.mgmt-context-form')) location.reload();
          } else setMsg(form, (x.data && x.data.error) || 'Failed', false);
        }).catch(function () { setMsg(form, 'Error', false); });
    });
  });
})();
</script>
{{end}}
