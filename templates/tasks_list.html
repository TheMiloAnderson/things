{{define "content"}}
<div class="space-y-3">
    <h1 class="text-lg md:text-xl font-semibold">Active tasks</h1>

    {{if not .Tasks}}
    <p class="text-gray-500 text-sm rounded-lg border border-dashed border-cgr-border px-4 py-8 text-center">No active tasks.</p>
    {{else}}
    <div>
        <div class="hidden md:grid md:grid-cols-[2fr_80px_1fr_1fr_155px] gap-x-2 items-center py-1 border-b border-cgr-border text-[11px] font-medium uppercase tracking-wider text-gray-500">
            <span class="pl-2">Name</span>
            <span class="pl-1.5">Priority</span>
            <span class="pl-1.5">Project</span>
            <span class="pl-1.5">Area</span>
            <span></span>
        </div>
        {{range .Tasks}}
        {{$task := .}}
        <form class="task-form grid grid-cols-3 md:grid-cols-[2fr_80px_1fr_1fr_155px] gap-x-1.5 md:gap-x-2 gap-y-1 md:gap-y-0 items-center py-1.5 md:py-1 border-b border-cgr-border/30" data-task-id="{{.ID}}">
            <input type="hidden" name="status" value="{{.Status}}" />
            <input type="text" name="name" value="{{.Name}}" required
                class="col-span-3 md:col-span-1 w-full rounded border border-cgr-border bg-cgr-panel/60 px-2 py-1 text-sm text-white focus:border-cgr-sage focus:outline-none focus:ring-1 focus:ring-cgr-sage" />
            <select name="priority"
                class="w-full rounded border border-cgr-border bg-cgr-panel/60 px-1 py-1 text-sm text-white focus:border-cgr-sage focus:outline-none focus:ring-1 focus:ring-cgr-sage">
                <option value="0" {{if eq .Priority 0}}selected{{end}}>Low</option>
                <option value="1" {{if eq .Priority 1}}selected{{end}}>Medium</option>
                <option value="2" {{if eq .Priority 2}}selected{{end}}>High</option>
            </select>
            <select name="project_id"
                class="w-full rounded border border-cgr-border bg-cgr-panel/60 px-1 py-1 text-sm text-white focus:border-cgr-sage focus:outline-none focus:ring-1 focus:ring-cgr-sage">
                <option value="">—</option>
                {{range $.Projects}}
                <option value="{{.ID}}" {{if eq $task.ProjectID .ID}}selected{{end}}>{{.Name}}</option>
                {{end}}
            </select>
            <select name="area_id"
                class="w-full rounded border border-cgr-border bg-cgr-panel/60 px-1 py-1 text-sm text-white focus:border-cgr-sage focus:outline-none focus:ring-1 focus:ring-cgr-sage">
                <option value="">—</option>
                {{range $.Areas}}
                <option value="{{.ID}}" {{if eq $task.AreaID .ID}}selected{{end}}>{{.Name}}</option>
                {{end}}
            </select>
            <div class="col-span-3 md:col-span-1 flex items-center gap-1.5 whitespace-nowrap">
                <button type="button" class="task-btn-update rounded bg-cgr-sage px-2.5 py-1 text-xs font-medium text-cgr-base hover:brightness-110 transition-[filter]">Save</button>
                <button type="button" class="task-btn-done rounded border border-cgr-border bg-cgr-panel/50 px-2.5 py-1 text-xs font-medium hover:border-cgr-coral/50 transition-colors">Done</button>
                <span class="task-msg text-xs text-gray-500"></span>
            </div>
        </form>
        {{end}}
    </div>
    {{end}}
</div>

<script>
(function () {
  function intOrNull(sel) {
    var v = sel.value;
    if (v === '' || v === null) return null;
    var n = parseInt(v, 10);
    return isNaN(n) ? null : n;
  }

  function payloadFromForm(form) {
    return {
      name: form.querySelector('[name=name]').value.trim(),
      status: form.querySelector('[name=status]').value,
      priority: parseInt(form.querySelector('[name=priority]').value, 10) || 0,
      project_id: intOrNull(form.querySelector('[name=project_id]')),
      area_id: intOrNull(form.querySelector('[name=area_id]'))
    };
  }

  function setMsg(form, text, ok) {
    var el = form.querySelector('.task-msg');
    el.textContent = text;
    el.classList.remove('text-cgr-sage', 'text-cgr-rose', 'text-gray-500');
    if (ok === true) el.classList.add('text-cgr-sage');
    else if (ok === false) el.classList.add('text-cgr-rose');
    else el.classList.add('text-gray-500');
  }

  document.querySelectorAll('.task-form').forEach(function (form) {
    var id = form.getAttribute('data-task-id');

    form.querySelector('.task-btn-update').addEventListener('click', function () {
      var body = payloadFromForm(form);
      if (!body.name) { setMsg(form, 'Name required', false); return; }
      setMsg(form, 'Saving…');
      fetch('/api/task/' + id + '/update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify(body)
      }).then(function (res) {
        return res.json().then(function (data) { return { res: res, data: data }; });
      }).then(function (x) {
        if (x.res.ok && x.data.ok) {
          setMsg(form, 'Saved', true);
          window.markFormSaved(form);
          if (body.status !== 'active') {
            form.remove();
            if (!document.querySelector('.task-form')) location.reload();
          }
        } else {
          setMsg(form, (x.data && x.data.error) || 'Failed', false);
        }
      }).catch(function () { setMsg(form, 'Error', false); });
    });

    form.querySelector('.task-btn-done').addEventListener('click', function () {
      setMsg(form, 'Saving…');
      fetch('/api/task/' + id + '/done', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: '{}'
      }).then(function (res) {
        return res.json().then(function (data) { return { res: res, data: data }; });
      }).then(function (x) {
        if (x.res.ok && x.data.ok) {
          form.remove();
          if (!document.querySelector('.task-form')) location.reload();
        } else {
          setMsg(form, (x.data && x.data.error) || 'Failed', false);
        }
      }).catch(function () { setMsg(form, 'Error', false); });
    });
  });
})();
</script>
{{end}}
