{{define "content"}}
{{template "management_nav" .}}
<div class="space-y-3">
    <div class="flex items-center justify-between gap-4">
        <h1 class="text-lg md:text-xl font-semibold">Projects</h1>
        <a href="/management/projects/new" class="rounded-md bg-cgr-sage px-3 py-1.5 text-xs font-medium text-cgr-base hover:brightness-110 transition-[filter]">New</a>
    </div>

    {{if not .Projects}}
    <p class="text-gray-500 text-sm rounded-lg border border-dashed border-cgr-border px-4 py-8 text-center">No projects yet.</p>
    {{else}}
    <ul class="divide-y divide-cgr-border/40">
        {{range .Projects}}
        <li>
            <a href="/management/projects/{{.ID}}" class="block px-2 py-2 text-sm hover:text-cgr-sage transition-colors">{{.Name}}</a>
        </li>
        {{end}}
    </ul>
    {{end}}
</div>
{{end}}
