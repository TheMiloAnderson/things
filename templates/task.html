{{define "content"}}
<div class="max-w-3xl space-y-4">
    <a href="/tasks/" class="text-sm hover:text-cgr-sage transition-colors">&larr; Task list</a>

    <header class="space-y-0.5">
        <h1 class="text-lg md:text-xl font-semibold">Task #{{.ID}}</h1>
        <p class="text-xs text-gray-500">Created {{.FormattedCreated}}</p>
    </header>

    <form action="/task/{{.ID}}" method="post" class="space-y-3">
        {{ csrfField }}
        <div class="grid grid-cols-[2fr_1fr_1fr] gap-x-2 md:gap-x-3">
            <span class="text-[11px] font-medium uppercase tracking-wider text-gray-500 pb-1">Name</span>
            <span class="text-[11px] font-medium uppercase tracking-wider text-gray-500 pb-1">Status</span>
            <span class="text-[11px] font-medium uppercase tracking-wider text-gray-500 pb-1">Priority</span>
            <input type="text" name="name" value="{{.Name}}" required
                class="w-full rounded-md border border-cgr-border bg-cgr-panel/60 px-2 py-1.5 text-sm text-white focus:border-cgr-sage focus:outline-none focus:ring-1 focus:ring-cgr-sage" />
            <select name="status"
                class="w-full rounded-md border border-cgr-border bg-cgr-panel/60 px-2 py-1.5 text-sm text-white focus:border-cgr-sage focus:outline-none focus:ring-1 focus:ring-cgr-sage">
                <option value="active" {{if eq .Status "active"}}selected{{end}}>Active</option>
                <option value="pending" {{if eq .Status "pending"}}selected{{end}}>Pending</option>
                <option value="done" {{if eq .Status "done"}}selected{{end}}>Done</option>
                <option value="canceled" {{if eq .Status "canceled"}}selected{{end}}>Canceled</option>
            </select>
            <select name="priority"
                class="w-full rounded-md border border-cgr-border bg-cgr-panel/60 px-2 py-1.5 text-sm text-white focus:border-cgr-sage focus:outline-none focus:ring-1 focus:ring-cgr-sage">
                <option value="0" {{if eq .Priority 0}}selected{{end}}>Low</option>
                <option value="1" {{if eq .Priority 1}}selected{{end}}>Medium</option>
                <option value="2" {{if eq .Priority 2}}selected{{end}}>High</option>
            </select>
        </div>

        <div class="grid grid-cols-2 gap-x-2 md:gap-x-3">
            <span class="text-[11px] font-medium uppercase tracking-wider text-gray-500 pb-1">Project</span>
            <span class="text-[11px] font-medium uppercase tracking-wider text-gray-500 pb-1">Area</span>
            <select name="project_id"
                class="w-full rounded-md border border-cgr-border bg-cgr-panel/60 px-2 py-1.5 text-sm text-white focus:border-cgr-sage focus:outline-none focus:ring-1 focus:ring-cgr-sage">
                <option value="">&mdash;</option>
                {{range .Projects}}
                <option value="{{.ID}}" {{if eq $.ProjectID .ID}}selected{{end}}>{{.Name}}</option>
                {{end}}
            </select>
            <select name="area_id"
                class="w-full rounded-md border border-cgr-border bg-cgr-panel/60 px-2 py-1.5 text-sm text-white focus:border-cgr-sage focus:outline-none focus:ring-1 focus:ring-cgr-sage">
                <option value="">&mdash;</option>
                {{range .Areas}}
                <option value="{{.ID}}" {{if eq $.AreaID .ID}}selected{{end}}>{{.Name}}</option>
                {{end}}
            </select>
        </div>

        <div>
            <span class="text-[11px] font-medium uppercase tracking-wider text-gray-500 pb-1 block">Notes</span>
            <textarea name="notes" rows="3"
                class="w-full rounded-md border border-cgr-border bg-cgr-panel/60 px-2 py-1.5 text-sm text-white focus:border-cgr-sage focus:outline-none focus:ring-1 focus:ring-cgr-sage resize-y">{{.Notes}}</textarea>
        </div>

        <button type="submit"
            class="rounded-md bg-cgr-sage px-3 py-1.5 text-sm font-medium text-cgr-base hover:brightness-110 transition-[filter]">
            Save changes
        </button>
    </form>
</div>
{{end}}
