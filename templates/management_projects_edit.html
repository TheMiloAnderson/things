{{define "content"}}
{{template "management_nav" .}}
<div class="space-y-4">
    <a href="/management/projects/" class="text-sm hover:text-cgr-sage transition-colors">&larr; All projects</a>

    <div class="flex flex-col xl:flex-row gap-5 xl:gap-8 xl:items-start">
        <form id="project-edit-form" method="post" action="/management/projects/{{.Project.ID}}" class="flex-1 min-w-0 space-y-3">
            <h2 class="text-base md:text-lg font-semibold">Edit project</h2>

            <div class="grid grid-cols-[2fr_1fr_1fr] gap-x-2 md:gap-x-3">
                <span class="text-[11px] font-medium uppercase tracking-wider text-gray-500 pb-1">Name</span>
                <span class="text-[11px] font-medium uppercase tracking-wider text-gray-500 pb-1">Status</span>
                <span class="text-[11px] font-medium uppercase tracking-wider text-gray-500 pb-1">Area</span>
                <input type="text" name="name" value="{{.Project.Name}}" required
                    class="w-full rounded-md border border-cgr-border bg-cgr-panel/60 px-2 py-1.5 text-sm text-white focus:border-cgr-sage focus:outline-none focus:ring-1 focus:ring-cgr-sage" />
                <select name="status"
                    class="w-full rounded-md border border-cgr-border bg-cgr-panel/60 px-2 py-1.5 text-sm text-white focus:border-cgr-sage focus:outline-none focus:ring-1 focus:ring-cgr-sage">
                    <option value="active" {{if eq .Project.Status "active"}}selected{{end}}>Active</option>
                    <option value="done" {{if eq .Project.Status "done"}}selected{{end}}>Done</option>
                    <option value="canceled" {{if eq .Project.Status "canceled"}}selected{{end}}>Canceled</option>
                </select>
                <select name="area_id"
                    class="w-full rounded-md border border-cgr-border bg-cgr-panel/60 px-2 py-1.5 text-sm text-white focus:border-cgr-sage focus:outline-none focus:ring-1 focus:ring-cgr-sage">
                    <option value="">&mdash;</option>
                    {{range .Areas}}
                    <option value="{{.ID}}" {{if eq $.Project.AreaID .ID}}selected{{end}}>{{.Name}}</option>
                    {{end}}
                </select>
            </div>

            <div>
                <span class="text-[11px] font-medium uppercase tracking-wider text-gray-500 pb-1 block">Notes</span>
                <textarea name="notes" rows="4"
                    class="w-full rounded-md border border-cgr-border bg-cgr-panel/60 px-2 py-1.5 text-sm text-white focus:border-cgr-sage focus:outline-none focus:ring-1 focus:ring-cgr-sage resize-y">{{.Project.Notes}}</textarea>
            </div>

            <div class="flex flex-wrap items-center gap-2 pt-1">
                <button type="submit"
                    class="rounded-md bg-cgr-sage px-3 py-1.5 text-xs font-medium text-cgr-base hover:brightness-110 transition-[filter]">Edit</button>
                <button type="button" id="project-delete-btn"
                    class="rounded-md border border-cgr-rose/50 px-3 py-1.5 text-xs font-medium text-cgr-rose hover:bg-cgr-rose/10 transition-colors">Delete</button>
                <span id="project-edit-msg" class="text-xs text-gray-500"></span>
            </div>
        </form>

        <form action="/task" method="post" class="w-full xl:w-72 shrink-0 space-y-3 rounded-lg border border-cgr-border bg-cgr-panel/40 p-4">
            <h2 class="text-sm font-semibold">New task</h2>
            <p class="text-[11px] text-gray-500">Added to <span class="text-white font-medium">{{.Project.Name}}</span></p>
            <input type="hidden" name="project_id" value="{{.Project.ID}}" />
            <input type="hidden" name="return_to" value="/management/projects/{{.Project.ID}}" />

            <div>
                <span class="text-[11px] font-medium uppercase tracking-wider text-gray-500 pb-1 block">Name</span>
                <input type="text" name="name" required
                    class="w-full rounded-md border border-cgr-border bg-cgr-panel/60 px-2 py-1.5 text-sm text-white focus:border-cgr-sage focus:outline-none focus:ring-1 focus:ring-cgr-sage" />
            </div>

            <div class="grid grid-cols-3 gap-x-2">
                <span class="text-[11px] font-medium uppercase tracking-wider text-gray-500 pb-1">Status</span>
                <span class="text-[11px] font-medium uppercase tracking-wider text-gray-500 pb-1">Priority</span>
                <span class="text-[11px] font-medium uppercase tracking-wider text-gray-500 pb-1">Area</span>
                <select name="status"
                    class="w-full rounded-md border border-cgr-border bg-cgr-panel/60 px-1.5 py-1.5 text-sm text-white focus:border-cgr-sage focus:outline-none focus:ring-1 focus:ring-cgr-sage">
                    <option value="active" selected>Active</option>
                    <option value="done">Done</option>
                    <option value="canceled">Canceled</option>
                </select>
                <select name="priority"
                    class="w-full rounded-md border border-cgr-border bg-cgr-panel/60 px-1.5 py-1.5 text-sm text-white focus:border-cgr-sage focus:outline-none focus:ring-1 focus:ring-cgr-sage">
                    <option value="0" selected>Low</option>
                    <option value="1">Medium</option>
                    <option value="2">High</option>
                </select>
                <select name="area_id"
                    class="w-full rounded-md border border-cgr-border bg-cgr-panel/60 px-1.5 py-1.5 text-sm text-white focus:border-cgr-sage focus:outline-none focus:ring-1 focus:ring-cgr-sage">
                    <option value="">&mdash;</option>
                    {{range .Areas}}
                    <option value="{{.ID}}">{{.Name}}</option>
                    {{end}}
                </select>
            </div>

            <button type="submit"
                class="rounded-md bg-cgr-sage px-3 py-1.5 text-xs font-medium text-cgr-base hover:brightness-110 transition-[filter]">Create</button>
        </form>
    </div>
</div>
<script>
(function () {
  var id = {{.Project.ID}};
  var msg = document.getElementById('project-edit-msg');
  document.getElementById('project-delete-btn').addEventListener('click', function () {
    if (!confirm('Delete this project? Tasks may lose their project link.')) return;
    msg.textContent = 'Deleting…';
    msg.className = 'text-xs text-gray-500';
    fetch('/api/project/' + id + '/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: '{}'
    }).then(function (res) { return res.json().then(function (data) { return { res: res, data: data }; }); })
      .then(function (x) {
        if (x.res.ok && x.data.ok) {
          window.location.href = '/management/projects/';
        } else {
          msg.textContent = (x.data && x.data.error) || 'Delete failed.';
          msg.className = 'text-xs text-cgr-rose';
        }
      }).catch(function () {
        msg.textContent = 'Network error.';
        msg.className = 'text-xs text-cgr-rose';
      });
  });
})();
</script>
{{end}}
