{{define "content"}}
{{template "management_nav" .}}
<div class="max-w-md space-y-4">
    <h1 class="text-xl font-semibold">New area</h1>
    <form method="post" action="/management/areas/" class="space-y-3">
        <div>
            <span class="text-[11px] font-medium uppercase tracking-wider text-gray-500 pb-1 block">Name</span>
            <input type="text" name="name" required
                class="w-full rounded-md border border-cgr-border bg-cgr-panel/60 px-2 py-1.5 text-sm text-white focus:border-cgr-sage focus:outline-none focus:ring-1 focus:ring-cgr-sage" />
        </div>
        <div class="flex gap-2 pt-1">
            <button type="submit"
                class="rounded-md bg-cgr-sage px-3 py-1.5 text-xs font-medium text-cgr-base hover:brightness-110 transition-[filter]">Save</button>
            <a href="/management/areas/"
                class="rounded-md border border-cgr-border bg-cgr-panel/50 px-3 py-1.5 text-xs font-medium hover:bg-cgr-panel transition-colors">Cancel</a>
        </div>
    </form>
</div>
{{end}}
