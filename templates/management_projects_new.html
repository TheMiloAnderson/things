{{define "content"}}
{{template "management_nav" .}}
<div class="max-w-2xl space-y-4">
    <h1 class="text-xl font-semibold">New project</h1>
    <form method="post" action="/management/projects/" class="space-y-3">
        <div class="grid grid-cols-[2fr_1fr_1fr] gap-x-3">
            <span class="text-[11px] font-medium uppercase tracking-wider text-gray-500 pb-1">Name</span>
            <span class="text-[11px] font-medium uppercase tracking-wider text-gray-500 pb-1">Status</span>
            <span class="text-[11px] font-medium uppercase tracking-wider text-gray-500 pb-1">Area</span>
            <input type="text" name="name" required
                class="w-full rounded-md border border-cgr-border bg-cgr-panel/60 px-2 py-1.5 text-sm text-white focus:border-cgr-sage focus:outline-none focus:ring-1 focus:ring-cgr-sage" />
            <select name="status"
                class="w-full rounded-md border border-cgr-border bg-cgr-panel/60 px-2 py-1.5 text-sm text-white focus:border-cgr-sage focus:outline-none focus:ring-1 focus:ring-cgr-sage">
                <option value="active" selected>Active</option>
                <option value="done">Done</option>
                <option value="canceled">Canceled</option>
            </select>
            <select name="area_id"
                class="w-full rounded-md border border-cgr-border bg-cgr-panel/60 px-2 py-1.5 text-sm text-white focus:border-cgr-sage focus:outline-none focus:ring-1 focus:ring-cgr-sage">
                <option value="">&mdash;</option>
                {{range .Areas}}
                <option value="{{.ID}}">{{.Name}}</option>
                {{end}}
            </select>
        </div>
        <div>
            <span class="text-[11px] font-medium uppercase tracking-wider text-gray-500 pb-1 block">Notes</span>
            <textarea name="notes" rows="4"
                class="w-full rounded-md border border-cgr-border bg-cgr-panel/60 px-2 py-1.5 text-sm text-white focus:border-cgr-sage focus:outline-none focus:ring-1 focus:ring-cgr-sage resize-y"></textarea>
        </div>
        <div class="flex gap-2 pt-1">
            <button type="submit"
                class="rounded-md bg-cgr-sage px-3 py-1.5 text-xs font-medium text-cgr-base hover:brightness-110 transition-[filter]">Save</button>
            <a href="/management/projects/"
                class="rounded-md border border-cgr-border bg-cgr-panel/50 px-3 py-1.5 text-xs font-medium hover:bg-cgr-panel transition-colors">Cancel</a>
        </div>
    </form>
</div>
{{end}}
