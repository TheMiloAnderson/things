<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrfToken }}">
    <title>Things</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['ui-sans-serif', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        cgr: {
                            base: '#2A363B',
                            panel: '#323d47',
                            border: '#3d4a52',
                            sage: '#99B898',
                            cream: '#FECEA8',
                            coral: '#FF847C',
                            rose: '#E84A5F',
                        },
                    },
                },
            },
        };
    </script>
    <style>
        .field-dirty,
        .field-dirty:focus {
            border-color: #FECEA8 !important;
            --tw-ring-color: #FECEA8 !important;
        }
        .field-saved,
        .field-saved:focus {
            border-color: #99B898 !important;
            --tw-ring-color: #99B898 !important;
        }
    </style>
</head>
<body class="h-full bg-cgr-base text-sm md:text-base text-white antialiased dark">
    <div class="min-h-full flex flex-col md:flex-row">
        <aside class="shrink-0 w-full md:w-44 lg:w-48 border-b md:border-b-0 md:border-r border-cgr-border/80 bg-cgr-panel/80 backdrop-blur-md">
            <div class="flex flex-row md:flex-col md:min-h-screen items-center md:items-stretch justify-between md:justify-start gap-3 px-3 py-2 md:px-3 md:py-5">
                <a href="/" class="text-lg font-semibold tracking-tight hover:text-cgr-sage transition-colors shrink-0">
                    THINGS
                </a>
                <nav class="flex flex-row md:flex-col flex-wrap items-center md:items-stretch justify-end md:justify-start gap-x-4 gap-y-2 md:gap-0.5 text-sm font-medium">
                    {{if .IsAuthenticated}}
                        <a href="/" class="hover:text-cgr-sage transition-colors md:rounded-md md:px-2 md:py-1.5 md:hover:bg-cgr-panel/60">Inbox</a>
                        <a href="/tasks/" class="hover:text-cgr-sage transition-colors md:rounded-md md:px-2 md:py-1.5 md:hover:bg-cgr-panel/60">Tasks</a>
                        <a href="/management/projects/" class="hover:text-cgr-sage transition-colors md:rounded-md md:px-2 md:py-1.5 md:hover:bg-cgr-panel/60">Management</a>
                        <a href="/logout" class="hover:text-cgr-rose transition-colors md:rounded-md md:px-2 md:py-1.5 md:hover:bg-cgr-panel/60 md:mt-2 md:border-t md:border-cgr-border md:pt-3">Logout</a>
                    {{else}}
                        <a href="/login" class="hover:text-cgr-sage transition-colors md:rounded-md md:px-2 md:py-1.5 md:hover:bg-cgr-panel/60">Login</a>
                    {{end}}
                </nav>
                {{if and .IsAuthenticated .Username}}
                <p class="hidden md:block text-xs text-gray-500 mt-auto pt-6 border-t border-cgr-border/80 truncate" title="{{.Username}}">
                    {{.Username}}
                </p>
                {{end}}
            </div>
        </aside>
        <main class="flex-1 min-w-0 min-h-0">
            <div class="mx-auto max-w-5xl px-3 py-3 md:px-6 md:py-5">
                {{template "content" .Data}}
            </div>
        </main>
    </div>
    <script>
    (function() {
        var meta = document.querySelector('meta[name=csrf-token]');
        window.csrfToken = (meta && meta.content) || '';
        // Wraps fetch() to automatically add X-CSRF-Token to non-GET same-origin requests.
        // Also forces credentials: 'same-origin' if not specified.
        window.csrfFetch = function(input, init) {
            init = init || {};
            var method = (init.method || 'GET').toUpperCase();
            if (method !== 'GET' && method !== 'HEAD' && method !== 'OPTIONS' && method !== 'TRACE') {
                init.headers = Object.assign({}, init.headers || {}, { 'X-CSRF-Token': window.csrfToken });
            }
            if (!init.credentials) {
                init.credentials = 'same-origin';
            }
            return fetch(input, init);
        };

        function markDirty(e) {
            if (e.target.matches('input:not([type=hidden]):not([type=submit]), select, textarea')) {
                e.target.classList.add('field-dirty');
                e.target.classList.remove('field-saved');
            }
        }
        document.addEventListener('input', markDirty);
        document.addEventListener('change', markDirty);
        window.markFormSaved = function(form) {
            form.querySelectorAll('.field-dirty').forEach(function(el) {
                el.classList.remove('field-dirty');
                el.classList.add('field-saved');
            });
        };
    })();
    </script>
</body>
</html>
