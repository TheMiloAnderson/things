<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Things</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        /* Coup de Grâce — COLOURlovers palette /1098589 (archived snapshot) */
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['ui-sans-serif', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        cgr: {
                            base: '#2A363B',
                            panel: '#323d47',
                            border: '#3d4a52',
                            muted: '#8a9a9e',
                            sage: '#99B898',
                            cream: '#FECEA8',
                            coral: '#FF847C',
                            rose: '#E84A5F',
                        },
                    },
                },
            },
        };
    </script>
</head>
<body class="h-full bg-cgr-base text-cgr-cream antialiased dark">
    <div class="min-h-full flex flex-col md:flex-row">
        <aside class="shrink-0 w-full md:w-56 lg:w-60 border-b md:border-b-0 md:border-r border-cgr-border/80 bg-cgr-panel/80 backdrop-blur-md">
            <div class="flex flex-row md:flex-col md:min-h-screen items-center md:items-stretch justify-between md:justify-start gap-3 px-4 py-3 md:px-5 md:py-8">
                <a href="/" class="text-lg font-semibold tracking-tight text-cgr-cream hover:text-cgr-sage transition-colors shrink-0">
                    THINGS
                </a>
                <nav class="flex flex-row md:flex-col flex-wrap items-center md:items-stretch justify-end md:justify-start gap-x-4 gap-y-2 md:gap-1 text-sm font-medium">
                    {{if .IsAuthenticated}}
                        <a href="/" class="text-cgr-sage/90 hover:text-cgr-cream transition-colors md:rounded-md md:px-2 md:py-1.5 md:hover:bg-cgr-panel/60">Inbox</a>
                        <a href="/tasks/" class="text-cgr-sage/90 hover:text-cgr-cream transition-colors md:rounded-md md:px-2 md:py-1.5 md:hover:bg-cgr-panel/60">Tasks</a>
                        <a href="/logout" class="text-cgr-muted hover:text-cgr-rose transition-colors md:rounded-md md:px-2 md:py-1.5 md:hover:bg-cgr-panel/60 md:mt-2 md:border-t md:border-cgr-border md:pt-3">Logout</a>
                    {{else}}
                        <a href="/login" class="text-cgr-sage/90 hover:text-cgr-cream transition-colors md:rounded-md md:px-2 md:py-1.5 md:hover:bg-cgr-panel/60">Login</a>
                    {{end}}
                </nav>
                {{if and .IsAuthenticated .Username}}
                <p class="hidden md:block text-xs text-cgr-muted mt-auto pt-6 border-t border-cgr-border/80 truncate" title="{{.Username}}">
                    {{.Username}}
                </p>
                {{end}}
            </div>
        </aside>
        <main class="flex-1 min-w-0 min-h-0">
            <div class="mx-auto max-w-5xl px-4 py-6 md:px-8 md:py-10">
                {{template "content" .Data}}
            </div>
        </main>
    </div>
</body>
</html>
