{{define "content"}}
{{$vm := .}}
<div class="mx-auto max-w-xs rounded-lg border border-cgr-border bg-cgr-panel/50 p-6">
    <h2 class="text-lg font-semibold mb-5">Create account</h2>
    {{if $vm.Error}}
    <p class="mb-4 rounded-md border border-cgr-rose/50 bg-cgr-rose/10 px-3 py-2 text-sm text-cgr-rose">{{$vm.Error}}</p>
    {{end}}
    <form action="/signup" method="POST" class="space-y-4">
        {{ csrfField }}
        <div>
            <span class="text-[11px] font-medium uppercase tracking-wider text-gray-500 pb-1 block">Username</span>
            <input type="text" name="username" required autofocus value="{{$vm.Username}}"
                class="w-full rounded-md border border-cgr-border bg-cgr-panel/60 px-2 py-1.5 text-sm text-white focus:border-cgr-sage focus:outline-none focus:ring-1 focus:ring-cgr-sage" />
        </div>
        <div>
            <span class="text-[11px] font-medium uppercase tracking-wider text-gray-500 pb-1 block">Email</span>
            <input type="email" name="email" required value="{{$vm.Email}}"
                class="w-full rounded-md border border-cgr-border bg-cgr-panel/60 px-2 py-1.5 text-sm text-white focus:border-cgr-sage focus:outline-none focus:ring-1 focus:ring-cgr-sage" />
        </div>
        <div>
            <span class="text-[11px] font-medium uppercase tracking-wider text-gray-500 pb-1 block">Password</span>
            <input type="password" name="password" required minlength="12"
                class="w-full rounded-md border border-cgr-border bg-cgr-panel/60 px-2 py-1.5 text-sm text-white focus:border-cgr-sage focus:outline-none focus:ring-1 focus:ring-cgr-sage" />
            <p class="mt-1 text-xs text-gray-500">At least 12 characters</p>
        </div>
        <div>
            <span class="text-[11px] font-medium uppercase tracking-wider text-gray-500 pb-1 block">Confirm password</span>
            <input type="password" name="password_confirm" required minlength="12"
                class="w-full rounded-md border border-cgr-border bg-cgr-panel/60 px-2 py-1.5 text-sm text-white focus:border-cgr-sage focus:outline-none focus:ring-1 focus:ring-cgr-sage" />
        </div>
        <button type="submit"
            class="w-full rounded-md bg-cgr-sage px-4 py-2 text-sm font-medium text-cgr-base hover:brightness-110 transition-[filter]">
            Sign up
        </button>
    </form>
    <p class="mt-4 text-center text-sm text-gray-400">
        Already have an account? <a href="/login" class="text-cgr-sage hover:underline">Sign in</a>
    </p>
</div>
{{end}}
