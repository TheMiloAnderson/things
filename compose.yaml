name: things

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tasks
      MYSQL_USER: ${DBUSER}
      MYSQL_PASSWORD: ${DBPASS}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      # Current full schema. The migrations alter databases created from an
      # older tables.sql; running them here fails because the columns exist.
      - ./internal/db/tables.sql:/docker-entrypoint-initdb.d/001_tables.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8888"
    environment:
      LISTEN_ADDR: 0.0.0.0:8888
      DBADDR: db:3306
      DBUSER: ${DBUSER}
      DBPASS: ${DBPASS}
      SESSION_KEY: ${SESSION_KEY}
      CSRF_KEY: ${CSRF_KEY}
      CSRF_INSECURE: ${CSRF_INSECURE:-}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM_ADDR: ${MAIL_FROM_ADDR:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://127.0.0.1:8888}
      NEW_ACCOUNT_NOTIFICATION_EMAIL: ${NEW_ACCOUNT_NOTIFICATION_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy

  backup:
    build: ./backup
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: tasks
      BACKUP_DBUSER: ${BACKUP_DBUSER:-}
      BACKUP_DBPASS: ${BACKUP_DBPASS:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-miloserve-backups}
      R2_BASE: ${R2_BASE:-backups}
    depends_on:
      db:
        condition: service_healthy

volumes:
  # External so `docker compose down -v` can't delete it. Create once with:
  #   docker volume create things_mysql_data
  mysql_data:
    external: true
    name: things_mysql_data
